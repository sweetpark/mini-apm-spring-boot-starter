plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'io.github.sweetpark'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '4.1.1'
    springVersion = '7.0.9'
    springBatchVersion = '6.0.5'
    slf4jVersion = '2.0.18'
    logbackVersion = '1.6.3'
    jacksonVersion = '2.22.2'
    servletApiVersion = '6.1.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    /* ===== Spring Core & Boot ===== */
    api "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    compileOnly "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    compileOnly "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"
    compileOnly "org.springframework.boot:spring-boot-starter-jdbc:${springBootVersion}"
    compileOnly "org.springframework:spring-web:${springVersion}"
    compileOnly "org.springframework:spring-jdbc:${springVersion}"

    /* ===== Logging & Observability ===== */
    compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    /* ===== JSON Processing ===== */
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    /* ===== Optional / Supported Runtimes ===== */
    compileOnly 'io.netty:netty-all:4.2.17.Final'
    compileOnly "org.springframework.batch:spring-batch-core:${springBatchVersion}"
    compileOnly 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    compileOnly "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"

    /* ===== SpotBugs Annotations ===== */
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'

    /* ===== Unit Testing ===== */
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-batch:${springBootVersion}"
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    testImplementation 'com.h2database:h2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/ApmCoreAutoConfiguration*',
                '**/ApmJpaAutoConfiguration*',
                '**/ApmMybatisAutoConfiguration*',
                '**/ApmWebAutoConfiguration*',
                '**/ApmNettyAutoConfiguration*',
                '**/ApmBatchAutoConfiguration*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                'io.github.sweetpark.apm.core.support.util.*',
                'io.github.sweetpark.apm.core.error.*'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

spotless {
    java {
        googleJavaFormat('1.18.1').reflowLongStrings()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

spotbugs {
    ignoreFailures = true
    excludeFilter = file("${project.rootDir}/config/spotbugs/exclude.xml")
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'mini-apm-spring-boot-starter'
                description = 'Lightweight Non-Invasive Observability & APM Starter for Spring Boot'
                url = 'https://github.com/sweetpark/mini-apm-spring-boot-starter'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'sweetpark'
                        name = 'sweetpark'
                        email = 'dev@sweetpark.io'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/sweetpark/mini-apm-spring-boot-starter.git'
                    developerConnection = 'scm:git:ssh://github.com:sweetpark/mini-apm-spring-boot-starter.git'
                    url = 'https://github.com/sweetpark/mini-apm-spring-boot-starter'
                }
            }
        }
    }
}
