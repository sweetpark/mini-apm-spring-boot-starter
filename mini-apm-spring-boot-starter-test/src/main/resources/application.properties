spring.application.name=mini-apm-test-app
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# APM Settings
apm.enabled=true
apm.trace.level=PROD
apm.trace.header-name=X-Trace-Id
apm.trace.interface-header-name=X-Interface-Id
apm.slow.api-ms=500
apm.slow.query.ms=100
apm.capture.body=ALWAYS
apm.capture.sql=ALWAYS
apm.security.masking-enabled=true

# Batch Settings
spring.batch.jdbc.initialize-schema=always