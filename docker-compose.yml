# One-command local observability stack for trying out mini-apm-spring-boot-starter.
#
#   docker compose up -d
#
# Loki collects logs, Promtail tails ./logs/*.log (where the sample app / your
# own app should write its logfmt output), and Grafana comes pre-provisioned
# with the Loki datasource and the bundled mini-apm dashboard.
#
# Then run the sample app (see examples/sample-app) or point your own app's
# logback file appender at ./logs/mini-apm.log, hit a few endpoints, and open
# Grafana at http://localhost:3000 (admin/admin) to see the dashboard fill in.
#
# Port clash? If 3000/3100 are already taken on your machine (e.g. by another
# Loki/Grafana stack), just remap the host side here, e.g. "3101:3100" /
# "3001:3000" -- the container-internal ports and provisioning don't change.
services:
  loki:
    image: grafana/loki:2.9.8
    container_name: mini-apm-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:2.9.8
    container_name: mini-apm-promtail
    depends_on:
      loki:
        condition: service_healthy
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/mini-apm:ro

  grafana:
    image: grafana/grafana:10.4.3
    container_name: mini-apm-grafana
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/mini-apm-dashboard.json:/var/lib/grafana/dashboards/mini-apm-dashboard.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  loki-data:
  grafana-data:
